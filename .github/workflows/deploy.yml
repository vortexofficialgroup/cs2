name: Deploy to Vultr

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER || secrets.VULTR_USERNAME }}
          password: ${{ secrets.VULTR_PASSWORD }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          envs: ADMIN_PASSWORD,ADMIN_SECRET,GEMINI_API_KEY
          script: |
            set -e
            if [ -d /var/www/ue-portal ]; then
              cd /var/www/ue-portal
            elif [ -d /var/www/Ue-portal ]; then
              cd /var/www/Ue-portal
            else
              echo "UE Portal checkout not found under /var/www." >&2
              exit 1
            fi
            git fetch origin main
            if git merge-base --is-ancestor HEAD origin/main; then
              git merge --ff-only origin/main
            else
              echo "Deployment checkout diverged from main; aligning it to origin/main."
              git reset --hard origin/main
            fi
            npm ci --omit=dev
            if [ ! -f /etc/ue-portal.env ]; then
              if [ -z "$ADMIN_PASSWORD" ] || [ -z "$ADMIN_SECRET" ]; then
                echo "Missing ADMIN_PASSWORD or ADMIN_SECRET deployment secrets." >&2
                exit 1
              fi
              mkdir -p /var/lib/ue-portal
              chmod 700 /var/lib/ue-portal
              umask 077
              cat > /etc/ue-portal.env <<EOF
            NODE_ENV=production
            PORT=3000
            ADMIN_PASSWORD=$ADMIN_PASSWORD
            ADMIN_SECRET=$ADMIN_SECRET
            STAFF_STORE_FILE=/var/lib/ue-portal/staff-users.json
            ADMIN_PASSWORD_STORE_FILE=/var/lib/ue-portal/admin-password.json
            EOF
              chmod 600 /etc/ue-portal.env
            fi
            if [ -n "$GEMINI_API_KEY" ]; then
              sed -i '/^GEMINI_API_KEY=/d' /etc/ue-portal.env
              printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> /etc/ue-portal.env
              chmod 600 /etc/ue-portal.env
            else
              echo "Warning: GEMINI_API_KEY Actions secret is not configured; AI requests will fail."
            fi
            set -a
            . /etc/ue-portal.env
            set +a
            pm2 delete ue-backend || true
            if pm2 describe ue-portal-api >/dev/null 2>&1; then
              pm2 restart ue-portal-api --update-env
            else
              pm2 start scripts/dev-server.js --name ue-portal-api
            fi
            pm2 save
            python3 - <<'PY'
            from pathlib import Path
            import re
            import shutil

            path = Path("/etc/nginx/sites-available/ue-portal")
            text = path.read_text()
            insertions = []
            found = False
            for match in re.finditer(r"(?m)^[ \t]*server\s*\{", text):
                opening = text.find("{", match.start(), match.end())
                depth = 1
                index = opening + 1
                while index < len(text) and depth:
                    line_start = text.rfind("\n", 0, index) + 1
                    if not text[line_start:index].strip() and text[index] == "#":
                        newline = text.find("\n", index)
                        index = len(text) if newline == -1 else newline
                        continue
                    if text[index] == "{":
                        depth += 1
                    elif text[index] == "}":
                        depth -= 1
                    index += 1
                block = text[match.start():index]
                if re.search(r"(?im)^\s*root\s+/var/www/(?:ue-portal|Ue-portal)/?;", block):
                    found = True
                    if not re.search(r"(?im)^\s*location\s+/api/\s*\{", block):
                        insertions.append(opening + 1)

            if not found:
                raise SystemExit("UE Portal server block not found in Nginx configuration.")

            if insertions:
                backup = path.with_name(path.name + ".before-api")
                if not backup.exists():
                    shutil.copy2(path, backup)
                proxy = """
                location /api/ {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                }
            """
                for position in reversed(insertions):
                    text = text[:position] + proxy + text[position:]
                path.write_text(text)
            PY
            nginx -t
            systemctl reload nginx
            python3 - <<'PY'
            import json
            import re
            from urllib.error import HTTPError
            from pathlib import Path
            from urllib.request import Request, urlopen

            config = Path("/etc/nginx/sites-available/ue-portal").read_text()
            match = re.search(r"(?m)^\s*server_name\s+([^;]+);", config)
            if not match:
                raise SystemExit("Nginx server_name is missing.")
            host = next((name for name in match.group(1).split() if name != "_"), "_")

            checks = (
                ("API", "http://127.0.0.1:3000/api/rooms", None),
                ("Nginx", "http://127.0.0.1/api/rooms", host),
            )
            for label, url, host_header in checks:
                try:
                    headers = {"Host": host_header} if host_header else {}
                    with urlopen(Request(url, headers=headers), timeout=10) as response:
                        json.load(response)
                except HTTPError as error:
                    body = error.read(500).decode("utf-8", errors="replace")
                    print(f"{label} health check failed for {url}: HTTP {error.code}: {body}")
                    raise SystemExit(1)
                print(f"{label} health check passed: {url}")
            PY
